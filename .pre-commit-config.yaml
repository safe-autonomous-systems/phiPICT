repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.6
    hooks:
      - id: ruff-format
        files: ^(src|tests)/
      - id: ruff-check
        files: ^(src|tests)/
        args: [ --fix ]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        files: ^src/
        exclude: ^src/phipict/.*\.pyi$
        additional_dependencies:
          - types-setuptools
          - types-psutil
          - scipy-stubs

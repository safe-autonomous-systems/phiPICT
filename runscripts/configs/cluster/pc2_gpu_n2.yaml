# @package _global_
defaults:
  - override /hydra/launcher: submitit_slurm

hydra:
  launcher:
    partition: gpu
    gres: "gpu:a100:1"
    cpus_per_task: 8
    mem_gb: 32
    timeout_min: 10080
    setup:
      - ml lang
      - ml Miniforge3
      - ml system/CUDA/12.8.0
      - conda activate fluidgym_mhd
      - export FLUIDGYM_LOCAL_DATA_PATH=/pc2/groups/hpc-prf-reinfphys/reinfph2/git_projects/fluidgym_mhd/local_data
      - export FLUIDGYM_WANDB_MODE=offline
      - export BOOM_MBRL_PATH=/pc2/groups/hpc-prf-reinfphys/reinfph2/git_projects/fluidgym_mhd/third_party/BOOM_MBRL
      - export TDMPC2_PATH=/pc2/groups/hpc-prf-reinfphys/reinfph2/git_projects/fluidgym_mhd/third_party/tdmpc2/tdmpc2

[project]
name = "phipict"
dynamic = ["version", "dependencies"]  # set in setup.py
description = "Differentiable multi-block PISO MHD solver for PyTorch"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Jannis Becktepe", email = "jannis.becktepe@tu-dortmund.de" }
]
requires-python = ">=3.11,<3.15"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
amg = ["pyamg>=4.0"]
# grid plots and image output in phipict.io.output (imported on first use)
plot = ["matplotlib>=3.9", "imageio"]
utils = ["psutil"]
all = ["phipict[amg,plot,utils]"]
dev = [
    "phipict[amg]",
    "pre-commit",
    "ruff",
    "mypy",
    "pybind11-stubgen",
    "pytest",
    "types-setuptools",
    "types-psutil",
    "scipy-stubs",
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
]

[build-system]
requires = ["setuptools>=77", "wheel", "numpy", "torch>=2.9"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88
extend-exclude = ["src/phipict/*.pyi"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "Q", "D", "ANN"]
ignore = [
  "D104",    # Missing docstring in public package
  "D105",    # Missing docstring in magic mthod
  "D203",    # 1 blank line required before class docstring
  "D205",    # 1 blank line between summary and description
  "D401",    # First line of docstring should be in imperative mood
  "E731",    # Do not assign a lambda expression, use a def
  "B010",    # Do not use `setattr`
  "ANN401",  # Dynamically typed expressions (Any) are allowed where needed
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]
"examples/*" = ["D103"]
# Code taken over from PICT. The listed rules are either formatting debt (E501)
# or have fixes that are not guaranteed to preserve behavior (printf -> format,
# removing unused variables, mutable defaults), and this package must stay
# semantically identical to the original solver.
"src/phipict/{core,analysis,io,utils}/*.py" = ["E501", "UP031", "F841", "B007", "B006"]
"src/phipict/grid/{shapes,resample}.py" = ["E501", "UP031", "F841", "B007", "B006"]

[tool.ruff.lint.isort]
known-first-party = ["phipict"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
files = ["src/phipict"]
exclude = ['src/phipict/_C\.pyi', 'src/phipict/_noise\.pyi']
mypy_path = "src"
explicit_package_bases = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["pyamg", "pyamg.*", "tensorflow", "psutil"]
ignore_missing_imports = true

# Generated by pybind11-stubgen (make stubs); its defaults do not always match
# the declared argument types.
[[tool.mypy.overrides]]
module = ["phipict._C", "phipict._noise"]
ignore_errors = true

[tool.pyright]
include = ["src/phipict", "tests"]
exclude = ["**/__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.cibuildwheel]
# The builds of one run are selected via CIBW_BUILD by .github/workflows/wheels.yml.
build = "cp311-manylinux_x86_64 cp312-manylinux_x86_64 cp313-manylinux_x86_64 cp314-manylinux_x86_64"
skip = "*musllinux*"
# Build against the torch installed in before-build instead of the pinned
# torch from [build-system], so the torch/CUDA combination can be selected.
build-frontend = { name = "pip", args = ["--no-build-isolation"] }
test-command = "python -c \"import phipict, phipict._C\""

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
# Build combination, e.g. TORCH_VERSION=2.14 CUDA_VERSION=13.0 CUDA_TAG=cu130
# PHIPICT_LOCAL_VERSION=1 tags the version (+ptXYcuXYZ) for the own wheel index;
# the PyPI wheels use PHIPICT_LOCAL_VERSION=0 PHIPICT_PIN_TORCH=1 instead.
environment-pass = [
    "TORCH_VERSION", "CUDA_VERSION", "CUDA_TAG", "TORCH_CUDA_ARCH_LIST", "MAX_JOBS",
    "PHIPICT_LOCAL_VERSION", "PHIPICT_PIN_TORCH",
]
# gcc-toolset-13 only exists for CUDA < 12.8 (see before-all), whose nvcc
# rejects the image's default GCC 14; otherwise the PATH entry is a no-op.
environment = """
CUDA_HOME=/usr/local/cuda-$CUDA_VERSION
PATH=/usr/local/cuda-$CUDA_VERSION/bin:/opt/rh/gcc-toolset-13/root/usr/bin:$PATH
PIP_NO_CACHE_DIR=1
"""
before-all = """
curl -sSL https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/cuda-rhel8.repo \
  -o /etc/yum.repos.d/cuda-rhel8.repo
dnf clean all
dnf -y install cuda-toolkit-$(echo $CUDA_VERSION | tr . -)
case $CUDA_VERSION in 12.[0-7]) dnf -y install gcc-toolset-13-gcc-c++ ;; esac
dnf clean all
"""
# TORCH_VERSION is a minor version (2.14); the latest patch release is used.
before-build = """
pip install "torch==$TORCH_VERSION.*" --index-url https://download.pytorch.org/whl/$CUDA_TAG
pip install "setuptools>=77" wheel numpy
"""
# The test venv installs torch with its CUDA wheels again; remove the toolkit
# (only needed to build) to free the disk. The repaired wheel needs only what
# torch provides, as for users without a toolkit.
before-test = "rm -rf /usr/local/cuda-$CUDA_VERSION /usr/local/cuda"
# libtorch and the CUDA runtime are provided by the user's torch install and
# must not be vendored into the wheel.
repair-wheel-command = """
auditwheel repair -w {dest_dir} {wheel} \
  --exclude 'libtorch*.so*' --exclude 'libc10*.so*' --exclude 'libshm*.so*' \
  --exclude 'libcudart.so*'
"""

[tool.setuptools.package-data]
phipict = ["py.typed", "*.pyi"]

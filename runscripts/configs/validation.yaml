# @package _global_
defaults:
  - _self_
  - case: hartmann_5

dynamic_forcing: false
forcing_factor: 0.1

precision: double
min_steps: 1000
max_steps: 5000
log_interval: 10
convergence_tol: 1e-6

reynolds_number: 2.0
hartmann_number: 10.0

sgs_model: none
advection_scheme: central

domain:
  H: 1.0
  L: 10.0
  U: 1.0
  nx: 100
  ny: 50
  grading_y_type: simple
  grading_z_type: simple
  grading_y: 10
  grading_z: 1.0

sim:
  dt: 5e-3
  corrector_steps: 2
  potential_normalize: true
  potential_use_BiCG: false
  potential_solve_max_iter: 5000
  pressure_solve_max_iter: 5000
  adaptive_cfl: 0.8

tol:
  mode: relative
  advection_mode: absolute
  advection: 1e-7
  pressure: 1e-2
  pressure_intermediate: 1e-1
  potential: 1e-4
  atol: 1e-14

pressure_warm_start: true
potential_return_best_result: true
potential_reuse_result: true
potential_use_preconditioner: true
potential_amg_options: null

hydra:
  output_subdir: "."
  run:
    dir: output/validation/${type}/${hartmann_number}/${domain.nx}x${domain.ny}
  sweep:
    dir: output/validation/${type}/${hartmann_number}/${domain.nx}x${domain.ny}
    subdir: ""
  job:
    chdir: true

